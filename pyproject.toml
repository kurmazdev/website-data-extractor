[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "website-data-extractor"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.162,<1", "uvicorn>=0.30,<1", "aiohttp>=3.14.4,<4", "yarl>=1.17,<2", "beautifulsoup4>=4.12,<5", "soupsieve>=2.9,<3", "openpyxl>=3.1,<4", "playwright>=1.48,<2", "starlette>=1.3.1,<2", "anyio>=4.14.2,<5", "multidict>=6.9.1,<7"]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10", "pytest-asyncio>=1.0,<2", "httpx>=0.27,<1", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
