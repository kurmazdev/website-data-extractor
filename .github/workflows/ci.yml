name: Verify application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c requirements-lock.txt -e '.[test]'
      - run: python -m playwright install --with-deps chromium
      - run: npm --prefix frontend ci
      - run: ruff check backend scripts && ruff format --check backend scripts
      - run: RUN_BROWSER_TESTS=1 pytest -q
      - run: npm --prefix frontend run typecheck && npm --prefix frontend run build && npm --prefix frontend run format:check
      - name: Verify UI and real downloads
        run: |
          mkdir -p artifacts
          python -m uvicorn extractor.api:app --host 127.0.0.1 --port 8000 > artifacts/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          python scripts/verify_ui.py
          python scripts/verify_layout.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: artifacts/
